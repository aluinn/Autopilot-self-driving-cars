name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # There is no build step: the site is plain static files, so "build" is covered by
      # the lint script (every file parses, index.html references real files) and the
      # e2e test (the page really loads and runs).
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Install browser for e2e
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke test
        run: npm run e2e
